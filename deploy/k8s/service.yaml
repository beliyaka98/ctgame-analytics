# The report on port 30080 of the k3s node (published to http://localhost:30080 by compose.yaml).
apiVersion: v1
kind: Service
metadata:
  name: ctgame-report
  namespace: ctgame-test
  labels:
    app.kubernetes.io/name: ctgame-report
    app.kubernetes.io/part-of: ctgame-analytics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ctgame-report
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
