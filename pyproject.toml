[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ctgame-analytics"
version = "0.1.0"
description = "Learner profiling, next-task recommendation and pilot evaluation for game-based critical-thinking tasks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Akniyet Sarsenbek" }]
keywords = ["educational data mining", "NMF", "k-means", "ANCOVA", "recommender", "critical thinking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ctgame = "ctgame.cli:main"

[project.urls]
Homepage = "https://github.com/beliyaka98/ctgame-analytics"
Documentation = "https://beliyaka98.github.io/ctgame-analytics/"
Issues = "https://github.com/beliyaka98/ctgame-analytics/issues"
Changelog = "https://github.com/beliyaka98/ctgame-analytics/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ctgame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["ctgame"]
omit = ["*/__main__.py"]  # 3-line shim, tested through a subprocess
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "SIM", "RUF"]


[tool.mypy]
python_version = "3.11"
files = ["src/ctgame"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
